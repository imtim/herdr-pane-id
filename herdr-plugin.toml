id = "pane-id"
name = "Pane ID"
version = "0.9.0"
min_herdr_version = "0.8.0"
description = "Label panes with their ID and agent name (pi | pF), tabs and workspaces with compact id labels, so you and your agents can address any pane or agent by id — pairs with the herdr agent skill; per-type configurable separator and always-visible behavior (config.toml)"
platforms = ["linux", "macos"]

[[events]]
on = "pane.created"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.closed"
command = ["python3", "workspace-sync.py"]

[[events]]
on = "pane.moved"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.moved"
command = ["python3", "workspace-sync.py"]

[[events]]
on = "tab.created"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "tab.renamed"
command = ["python3", "tab-label.py"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "workspace.created"
command = ["python3", "workspace-sync.py"]

[[events]]
on = "workspace.renamed"
command = ["python3", "workspace-sync.py"]

[[events]]
on = "workspace.updated"
command = ["python3", "workspace-sync.py"]

[[startup]]
command = ["python3", "workspace-sync.py"]

[[startup]]
command = ["python3", "tab-label.py"]

[[startup]]
command = ["bash", "on-pane-event.sh", "--reconcile"]
