id = "pane-id"
name = "Pane ID"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Label every pane with its pane ID; append the agent name once herdr detects one"
platforms = ["linux", "macos"]

[[events]]
on = "pane.created"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "on-pane-event.sh"]

[[startup]]
command = ["python3", "label-existing-tabs.py"]
