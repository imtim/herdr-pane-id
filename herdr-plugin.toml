id = "pane-id"
name = "Pane ID"
version = "0.3.1"
min_herdr_version = "0.8.0"
description = "Label every pane with its pane ID (plus agent name); single-pane tabs show '<number>: <tab-id>: <pane-id>'"
platforms = ["linux", "macos"]

[[events]]
on = "pane.created"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "tab.created"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "on-pane-event.sh"]

[[startup]]
command = ["python3", "workspace-id-prefix.py"]

[[startup]]
command = ["python3", "tab-label.py"]
