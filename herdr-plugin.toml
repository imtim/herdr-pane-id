id = "pane-id"
name = "Pane ID"
version = "0.7.0"
min_herdr_version = "0.8.0"
description = "Label every pane with its pane ID (plus agent name); compact tab labels; workspace labels '<name>:wP' follow the root pane folder; configurable id separator and always-visible behavior (config.toml)"
platforms = ["linux", "macos"]

[[events]]
on = "pane.created"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.closed"
command = ["python3", "workspace-sync.py"]

[[events]]
on = "pane.moved"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "pane.moved"
command = ["python3", "workspace-sync.py"]

[[events]]
on = "tab.created"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "tab.renamed"
command = ["python3", "tab-label.py"]

[[events]]
on = "pane.agent_detected"
command = ["bash", "on-pane-event.sh"]

[[events]]
on = "workspace.created"
command = ["python3", "workspace-sync.py"]

[[events]]
on = "workspace.renamed"
command = ["python3", "workspace-sync.py"]

[[events]]
on = "workspace.updated"
command = ["python3", "workspace-sync.py"]

[[startup]]
command = ["python3", "workspace-sync.py"]

[[startup]]
command = ["python3", "tab-label.py"]

[[startup]]
command = ["bash", "on-pane-event.sh", "--reconcile"]
